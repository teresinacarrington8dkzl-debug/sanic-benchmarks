            b=$(wc -c </tmp/.wrk3/grove.quark.client.socket); echo "produced: $b"; echo "kb: $((b/1024))"
      - persist_to_workspace:
          root: /tmp/.wrk3
          paths:
            - 'grove.quark.client.socket'
